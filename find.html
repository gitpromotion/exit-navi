<style>
.app{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:22px;align-items:start;padding:28px 0 64px}
.mapbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;position:sticky;top:76px}
.mapbox svg{width:100%;height:auto;display:block;touch-action:manipulation}
.z{cursor:pointer;transition:opacity .15s}.z:hover{opacity:.8}
.lb{text-anchor:middle;font-family:'Noto Sans KR',sans-serif;pointer-events:none}
.lb.zn{font-size:3.3px;font-weight:700;fill:#0b0b0b}.lb.dl{font-size:2.3px;fill:#0b0b0b}.lb.w{fill:#fff}
.lb.dn{font-size:2.8px;fill:#52514e}.lb.gt{font-size:3.6px;font-weight:900}.lb.s{font-size:3px;fill:#8a8983}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink2);padding:8px 6px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.ctrl label{font-size:13px;color:var(--ink2);font-weight:700}
select,.seg button{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;color:var(--ink)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font-size:14px;padding:6px 12px;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.res{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.res .empty{color:var(--ink2);padding:4px 2px}
.empty h3{margin:0 0 6px;font-size:20px;color:var(--ink)}
.empty .how{font-size:14px;line-height:1.7;margin:0}
.empty .try{margin:18px 0 6px;font-size:12.5px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
.empty .chips{display:flex;flex-wrap:wrap;gap:8px}
.empty .chips button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.empty .chips button:hover{border-color:var(--ink)}
.empty .chips button small{color:var(--ink3);margin-left:4px;font-size:12px}
.empty .feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.empty .feat div{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6}
.empty .feat b{display:block;font-size:14.5px;color:var(--ink);margin-bottom:2px}
.empty .ft{font-size:12px;color:var(--ink3);margin-top:14px}
@media(max-width:520px){.empty .feat{grid-template-columns:1fr}}
.res .zone{font-size:14px;color:var(--ink2);font-weight:700}
.res .exit{font-size:clamp(34px,4vw,46px);font-weight:900;letter-spacing:-1px;line-height:1.15;margin:4px 0 2px}
.res .when{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:15px}
.rows{margin:22px 0 6px;display:grid;gap:10px}
.row{display:grid;grid-template-columns:96px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.row .bar{height:22px;background:var(--soft);border-radius:6px;overflow:hidden;display:flex}
.row .bar span{display:block;height:100%}
.row .bar span+span{border-left:2px solid #fff}
.row b{text-align:right;font-variant-numeric:tabular-nums}
.keys{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.ann{background:#eaf2fd;border:1px solid #b5d0f5;color:#123e73;border-radius:12px;padding:12px 14px;font-size:15px;margin-top:16px}
.cmp{font-size:14px;color:var(--ink2);margin-top:14px;line-height:1.8}
.cmp b{color:var(--ink)}
.qr{margin-top:18px;font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:14px}
.qr code{background:var(--soft);padding:2px 6px;border-radius:6px}
.annhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.lseg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px;gap:2px}
.lseg button{font:inherit;border:0;background:transparent;font-size:12px;padding:4px 9px;cursor:pointer;border-radius:6px;color:var(--ink)}
.lseg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.say{font:inherit;font-size:13px;border:1px solid #b5d0f5;background:#fff;color:#123e73;border-radius:8px;padding:4px 10px;cursor:pointer;margin-left:auto}
.ann{margin-top:8px}
.rw{margin-top:18px;border:1px solid #f0d9a8;background:linear-gradient(180deg,#fffaf0,#fff);border-radius:16px;padding:16px 18px}
.rw h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rw h4 small{font-weight:400;font-size:12px;color:#8a6a1f}
.rw .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.rw .cd{font-size:13px;color:#6b5a2e}
.rw .cd b{display:block;font-size:40px;line-height:1.05;font-weight:900;color:#0b0b0b;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.rw .cd b.go{color:#0f8a5f}
.rw .ctl{display:flex;gap:6px;flex-wrap:wrap}
.rw .ctl button{font:inherit;font-size:12.5px;border:1px solid #e3cf9f;background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;color:#4a3a12}
.rw .ctl button.on{background:#0b0b0b;color:#fff;border-color:#0b0b0b}
.rw .pb{height:8px;background:#f3ead5;border-radius:4px;overflow:hidden;margin:12px 0 4px}
.rw .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#eda100,#1baf7a);border-radius:4px;transition:width .25s linear}
.rw .led{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.rw .led li{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;font-size:13.5px;padding:7px 10px;border-radius:10px;background:#fff;border:1px solid #f1e6cc;color:#6b5a2e;transition:all .2s}
.rw .led li .tm{font-size:12px;font-variant-numeric:tabular-nums;color:#a38a4f}
.rw .led li.now{border-color:#0b0b0b;color:#0b0b0b;font-weight:700;box-shadow:0 1px 0 #0b0b0b}
.rw .led li.now .tm{color:#0b0b0b}
.rw .led li.done{opacity:.45}
.rw .cp{margin-top:12px;border:1.5px dashed #d9c38f;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;transition:all .3s}
.rw .cp .ic{font-size:30px;text-align:center}
.rw .cp .tx{font-size:13px;color:#6b5a2e;line-height:1.6}
.rw .cp .tx b{font-size:15px;color:#0b0b0b}
.rw .cp.open{border-style:solid;border-color:#1baf7a;background:#effaf5}
.rw .cp code{font-size:13px;background:#fff;border:1px solid #bfe6d5;border-radius:6px;padding:1px 6px}
.rw .early{margin-top:10px;font-size:13px;line-height:1.7;color:var(--ink2);background:#f6f5f1;border-radius:10px;padding:10px 12px;display:none}
.rw .early.on{display:block}
.rw .early b{color:var(--ink)}
.rw .ft{font-size:11.5px;color:#a38a4f;margin-top:10px;line-height:1.6}
#res{scroll-margin-top:70px}
.home{margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:16px}
.home h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.home h4 input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:3px 6px;margin-left:auto}
.home h4 label{font-size:12px;font-weight:400;color:var(--ink2);margin-left:auto}
.trip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.trip div{background:var(--soft);border-radius:10px;padding:10px 6px;font-size:12px;color:var(--ink2)}
.trip b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.home p{font-size:13px;color:var(--ink2);margin:10px 0 0;line-height:1.7}
.hseg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px;gap:2px}
.hseg button{font:inherit;border:0;background:transparent;font-size:12.5px;padding:4px 10px;cursor:pointer;border-radius:6px;color:var(--ink)}
.hseg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.wxrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink2)}
.wxtip{margin-top:8px;font-size:13.5px;line-height:1.7;border-radius:10px;padding:10px 12px;background:#f6f5f1;color:var(--ink)}
.wxtip small{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.gbar{display:flex;height:20px;border-radius:5px;overflow:hidden;font-size:11px;font-weight:700;color:#fff;margin:10px 0 4px}
.gbar span{display:flex;align-items:center;padding-left:6px;white-space:nowrap;overflow:hidden}
.gbar span+span{border-left:2px solid #fff}
@media(max-width:900px){.app{grid-template-columns:1fr}.mapbox{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <div style="padding-top:36px">
    <p class="eyebrow">관객용</p>
    <h2 class="t" style="margin-bottom:6px">내 구역 출구 찾기</h2>
    <p class="lead" style="margin-bottom:0">좌석 구역을 누르거나 고르면, 어느 출구로 언제 나가면 덜 기다리는지 알려 드려요. <a href="qr.html" style="font-size:14px;font-weight:700;white-space:nowrap">🔳 좌석 QR로 바로 열기 →</a> <a href="#" data-install style="font-size:14px;font-weight:700;white-space:nowrap">📱 앱으로 설치</a></p>
  </div>
  <div class="app">
    <div class="mapbox">
      <svg id="map" viewBox="-87 -87 174 174" role="img" aria-label="KSPO DOME 구역 지도"></svg>
      <div class="legend">
        <span><i style="background:#6250d6"></i>2-1문</span><span><i style="background:#2a78d6"></i>2-2문</span><span><i style="background:#d55181"></i>2-3문</span>
        <span>연한 색 = 잠시 기다렸다 출발</span><span><i style="background:#0f766e"></i>♿ 장애인석 (누르면 우선 퇴장 안내)</span>
      </div>
    </div>
    <div>
      <div class="ctrl">
        <label for="zsel">내 구역</label>
        <select id="zsel"><option value="">구역 선택</option></select>
        <div id="floor"></div>
      </div>
      <div class="res" id="res"></div>
    </div>
  </div>
</div>
<script src="js/data2.js?v=2"></script>
<script src="js/common.js?v=5"></script>
<script src="js/data_park.js?v=1"></script>
<script>
var state = { z: null, f: 2000, lang: 'ko', end: '21:30', mode: 'subway', wx: 'clear' };
function clock(base, add) { var p = base.split(':'), m = +p[0] * 60 + +p[1] + Math.round(add); m = (m + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
var sel = document.getElementById('zsel');
ACCESS.segs.forEach(function (g) { var o = document.createElement('option'); o.value = g.id; o.textContent = '♿ ' + g.label; sel.appendChild(o); });
Z.forEach(function (z) { var o = document.createElement('option'); o.value = z.id; o.textContent = (z.ring ? '3층 ' : '2층 ') + z.id + '구역'; sel.appendChild(o); });
sel.onchange = function () { pick(!sel.value ? null : (sel.value.charAt(0) === 'W' ? sel.value : +sel.value)); };
floorControl(document.getElementById('floor'), state.f, function (v) { state.f = v; render(); });
function toResult() { if (window.innerWidth <= 900) { var r = document.getElementById('res'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }
function pick(z) { state.z = z; sel.value = z || ''; if (z) history.replaceState(null, '', location.search + '#z=' + z); render(); if (z) toResult(); }

function emptyHTML() {
  return '<div class="empty"><h3>내 좌석 구역을 골라 주세요</h3>' +
    '<p class="how">왼쪽 지도에서 내 구역을 누르거나, 위 <b>내 구역</b> 목록에서 고르세요. 티켓에 적힌 구역 번호(예: 2층 18구역, 3층 47구역)를 찾으면 돼요. 공연장 좌석의 <b>QR</b>을 찍으면 바로 열려요.</p>' +
    '<div class="try">예시로 바로 보기</div><div class="chips">' +
      [18, 16, 33, 47].map(function (z) { var d = estimate(keyOf('P4', state.f), z).delay; return '<button data-z="' + z + '">' + (z <= 22 ? '2층 ' : '3층 ') + z + '구역<small>' + (d ? (d >= 4 ? '🎁 ' : '') + d + '분 뒤 출발' : '바로 출발') + '</small></button>'; }).join('') +
      '<button data-z="W2">♿ 장애인석<small>우선 퇴장</small></button></div>' +
    '<div class="try">고르면 이런 걸 알려 드려요</div><div class="feat">' +
      '<div><b>🚪 나갈 출구와 출발 시각</b>지금처럼 나갈 때와 비교해 줄과 대기 시간이 얼마나 줄어드는지</div>' +
      '<div><b>🔊 4개 언어 안내 방송</b>한국어·영어·일본어·중국어 문구와 음성</div>' +
      '<div><b>🎁 기다림 보상</b>기다리는 구역은 무대 LED 콘텐츠와 출발 시각 쿠폰</div>' +
      '<div><b>🚇 🚗 귀갓길</b>올림픽공원역 도착 시각, 자가용이면 주차장 출차 예보, 날씨 안내</div></div>' +
    '<div class="ft">시간과 줄 인원은 실제 공공데이터를 바탕으로 한 퇴장 시뮬레이션 결과예요.</div></div>';
}
function render() {
  var kN = keyOf('P4', state.f), kC = keyOf('P0', state.f);
  drawMap(document.getElementById('map'), { key: kN, selected: state.z, onPick: pick, showDelay: true });
  var box = document.getElementById('res');
  if (!state.z) { clearInterval(RW.timer); RW.timer = null; box.innerHTML = emptyHTML(); box.querySelectorAll('[data-z]').forEach(function (b) { b.onclick = function () { var v = b.dataset.z; pick(v.charAt(0) === 'W' ? v : +v); }; }); return; }
  if (typeof state.z === 'string') { clearInterval(RW.timer); RW.timer = null; renderAccess(box, kN, kC); return; }
  var zz = Z.filter(function (z) { return z.id === state.z; })[0];
  var n = estimate(kN, state.z), c = estimate(kC, state.z), col = GATE[n.gate];
  var max = Math.max(n.total, c.total, 1);
  function bar(e) {
    return '<div class="bar">' +
      (e.delay ? '<span style="width:' + (e.delay / max * 100) + '%;background:#c3c2b7"></span>' : '') +
      '<span style="width:' + (e.walk / max * 100) + '%;background:#8a8983"></span>' +
      '<span style="width:' + (e.wait / max * 100) + '%;background:' + losColor(e.queue) + '"></span></div>';
  }
  var when = n.delay ? '공연 종료 ' + n.delay + '분 뒤 출발' : '공연 종료 직후 바로 출발';
  var changed = n.door !== c.door;
  box.innerHTML =
    '<div class="zone">' + (zz.ring ? '3층' : '2층') + ' ' + zz.id + '구역 · 좌석 ' + zz.seats + '석</div>' +
    '<div class="exit" style="color:' + col + '">' + n.gate + ' <span style="color:var(--ink)">' + doorName(n.door) + '</span></div>' +
    '<div class="when" style="background:' + mix(col, 0.85) + ';color:' + col + '">' + when + '</div>' +
    '<div class="rows">' +
      '<div class="keys"><span><i style="background:#c3c2b7"></i>자리에서 대기</span><span><i style="background:#8a8983"></i>걷기</span><span><i style="background:#1baf7a"></i>출구 줄 (색 = 혼잡도)</span></div>' +
      '<div class="row"><span>지금처럼</span>' + bar(c) + '<b>' + c.total.toFixed(1) + '분</b></div>' +
      '<div class="row"><span><b style="text-align:left">EXIT NAVI</b></span>' + bar(n) + '<b>' + n.total.toFixed(1) + '분</b></div>' +
    '</div>' +
    '<div class="cmp">지금처럼 나가면 <b>' + c.gate + ' ' + doorName(c.door) + '</b> 앞 줄이 약 <b>' + fmt(c.queue) + '명</b>(' + losName(c.queue) + ')이라 줄에서만 약 ' + c.wait.toFixed(1) + '분을 기다려요.<br>' +
      'EXIT NAVI 안내대로 ' + (changed ? '<b>' + n.gate + ' ' + doorName(n.door) + '</b>(으)로 나가면' : '같은 출구로 ' + (n.delay ? n.delay + '분 늦게 ' : '') + '나가면') +
      ' 줄은 약 <b>' + fmt(n.queue) + '명</b>(' + losName(n.queue) + '), 줄 대기 약 ' + n.wait.toFixed(1) + '분이에요.</div>' +
    rewardCard(zz, n, c) +
    '<div class="annhead"><b style="font-size:14px">📢 안내 방송</b><span class="lseg" id="lseg">' + Object.keys(LANGS).map(function (k) { return '<button data-l="' + k + '"' + (k === state.lang ? ' class="on"' : '') + '>' + LANGS[k].name + '</button>'; }).join('') + '</span><button class="say" id="say">🔊 듣기</button></div>' +
    '<div class="ann">' + zoneLine(zz.id, n.gate, n.delay, state.lang, false) + '</div>' +
    homeCard(zz, n, c) +
    '<div class="qr">좌석 QR 코드에 <code>find.html#z=' + zz.id + '</code> 주소를 넣으면 관객이 찍자마자 이 화면을 볼 수 있어요.<br>시간은 구역 관객 중 가운데 사람 기준 예상치이며, 시뮬레이션 결과입니다.</div>';
  box.querySelectorAll('#lseg button').forEach(function (b) { b.onclick = function () { state.lang = b.dataset.l; stopSpeak(); render(); }; });
  box.querySelector('#say').onclick = function () { speak(zoneLine(zz.id, n.gate, n.delay, state.lang, true), state.lang); };
  box.querySelector('#endt').onchange = function (e) { if (e.target.value) { state.end = e.target.value; render(); } };
  box.querySelectorAll('#hmode button').forEach(function (b) { b.onclick = function () { state.mode = b.dataset.m; render(); }; });
  box.querySelectorAll('#wxseg button').forEach(function (b) { b.onclick = function () { state.wx = b.dataset.w; render(); }; });
  bindReward(zz, n);
}
// ---------- 🎁 기다림 보상 카드: 대기 구역 카운트다운 + 무대 LED 콘텐츠 + 출발 시각 쿠폰 ----------
var RW = { z: null, f: null, t: 0, run: false, sp: 1, last: 0, timer: null, early: false };
function rwProgram(d) {   // 기다리는 시간(분)을 셋으로 나눠 무대 LED 프로그램 편성
  var a = Math.round(d * 60 * 0.35), b = Math.round(d * 60 * 0.7), e = d * 60;
